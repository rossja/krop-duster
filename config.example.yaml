# KROP Duster Configuration Example
# Copy this file to config.yaml and customize for your needs

# Tokenizer configuration
tokenizer: "gpt-4"  # Options: gpt-4, gpt-3.5-turbo, llama2, etc.

# LLM configuration
llm:
  provider: "openai"  # Options: openai, anthropic, ollama, templates
  model: "gpt-4"
  api_key: null  # Leave null to use environment variable
  api_base: null  # Optional custom API endpoint
  temperature: 0.7
  max_tokens: 200
  top_p: 0.9
  timeout: 30
  max_retries: 3
  detect_refusal: true
  fallback_on_refusal: true

# Sampling configuration
sampling:
  temperature: 1.0
  top_k: 50
  top_p: 0.9
  seed: null  # Set a number for reproducibility

# Analysis configuration
analysis:
  spacy_model: "en_core_web_sm"
  min_priority_score: 0.3
  max_concepts: 10
  enable_harmful_content_detection: true

# Generation configuration
generation:
  max_variants_per_concept: 3
  max_layers: 1
  enable_knowledge_graph: true
  enable_llm: true
  enable_templates: true
  min_semantic_similarity: 0.7

# Output configuration
output_format: "json"  # Options: json, yaml, csv
output_file: null  # Set to save to file
verbose: false

# Examples for different providers:

# OpenAI configuration:
# llm:
#   provider: "openai"
#   model: "gpt-4"
#   api_key: "${OPENAI_API_KEY}"
#   temperature: 0.7

# Ollama (local uncensored model):
# llm:
#   provider: "ollama"
#   model: "dolphin-mixtral"
#   api_base: "http://localhost:11434"
#   temperature: 0.7

# Anthropic:
# llm:
#   provider: "anthropic"
#   model: "claude-sonnet-4"
#   api_key: "${ANTHROPIC_API_KEY}"
#   temperature: 0.7

# Templates only (no LLM):
# llm:
#   provider: "templates"
# generation:
#   enable_llm: false
